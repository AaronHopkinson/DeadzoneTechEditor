name: Build Windows editor

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish standalone executable
        run: dotnet publish DeadzoneTechEditor/DeadzoneTechEditor.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: DeadzoneTechEditor-win-x64
          path: publish/DeadzoneTechEditor.exe
      - name: Publish v0.2.0 release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view v0.2.0 >/dev/null 2>&1; then
            gh release create v0.2.0 publish/DeadzoneTechEditor.exe --target "$GITHUB_SHA" --title "Deadzone Tech Editor v0.2.0" --notes "Locates persistent Tech totals by name, validates the edited save, and preserves backups. Close the game before editing and keep your original save."
          fi

name: Build Windows editor

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish standalone executable
        run: dotnet publish DeadzoneTechEditor/DeadzoneTechEditor.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: DeadzoneTechEditor-win-x64
          path: publish/DeadzoneTechEditor.exe

  release-test-build:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DeadzoneTechEditor-win-x64
          path: release
      - name: Publish v0.3.0 test EXE
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create v0.3.0-rc1 release/DeadzoneTechEditor.exe --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Deadzone Tech Editor v0.3.0 test build" --notes "Test build: edits the current Tech inventory entry identified from two player saves. Back up your save, close the game, and confirm the displayed value in game. Supersedes v0.2.0 for testing."
